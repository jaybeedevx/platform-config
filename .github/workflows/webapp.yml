name: webapp

on:
  push:
    paths:
      - "charts/webapp/**"
      - "src/**"
  pull_request:
    paths:
      - "charts/webapp/**"
      - "src/**"
  # Manual trigger: run the images job on demand from the branch you pick
  # (Actions > "webapp" > "Run workflow"). Useful to build/push before a merge.
  workflow_dispatch:

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint charts/webapp
      - name: Render chart
        run: helm template webapp charts/webapp --namespace webapp

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm install
      - name: Build
        run: npm run build

  # Build and push immutable, git-SHA-tagged images to ECR.
  # - Auto: on push to main (when a src/ change lands).
  # - Manual: via workflow_dispatch from any branch (e.g. pre-merge test push).
  # Auth uses GitHub Actions OIDC -> an IAM role that can push to ECR.
  #   - Set repository secret AWS_ROLE_TO_ASSUME to the role ARN.
  #   - Configure GitHub as an OIDC IdP for the AWS account, with a trust policy
  #     on the role that allows this repo to assume it.
  # To deploy a build: bump the `tag` in charts/webapp/values.yaml to its SHA and
  # let ArgoCD self-heal. No tag moves here — SHA is auditable.
  images:
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 510884921152.dkr.ecr.us-east-1.amazonaws.com
    strategy:
      matrix:
        include:
          - context: src/backend
            image: webapp-backend
          - context: src/frontend
            image: webapp-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max