apiVersion: v1
kind: Service
metadata:
  name: {{ include "webapp.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "webapp.backend.selectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "webapp.backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http