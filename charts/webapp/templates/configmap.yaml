apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}-backend-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.backend.config.APP_ENV | quote }}
  LOG_LEVEL: {{ .Values.backend.config.LOG_LEVEL | quote }}