apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "webapp.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "webapp.backend.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "webapp.frontend.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "webapp.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "webapp.frontend.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 80
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "webapp.backend.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP