backend:
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  hpa:
    minReplicas: 3
    maxReplicas: 10
frontend:
  replicas: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    minReplicas: 3
    maxReplicas: 8
# Prometheus operator not yet installed in this cluster (see modules/addons).
# Flip this to true once kube-prometheus-stack is provisioned.
monitoring:
  enabled: false

ingress:
  host: webapp.prod.example.com
